plugins { id 'com.android.application' }
android {
  namespace 'org.omega.actions'
  compileSdk 35
  defaultConfig {
    applicationId 'org.omega.actions'
    minSdk 26
    targetSdk 28
    versionCode 6
    versionName '1.3.0-dev'
  }
  signingConfigs {
    release {
      storeFile file(System.getenv('OMEGA_KEYSTORE') ?: 'release-keystore-unavailable.jks')
      storePassword System.getenv('OMEGA_KEYSTORE_PASSWORD') ?: ''
      keyAlias System.getenv('OMEGA_KEY_ALIAS') ?: ''
      keyPassword System.getenv('OMEGA_KEY_PASSWORD') ?: ''
    }
  }
  buildTypes {
    release {
      signingConfig signingConfigs.release
      minifyEnabled false
    }
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
