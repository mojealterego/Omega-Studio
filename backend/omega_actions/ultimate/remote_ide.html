<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OMEGA Studio — Sovereign IDE</title>
<style>
:root{color-scheme:dark;--bg:#07080a;--pane:#0f1116;--pane2:#151820;--line:#282a31;--gold:#d4af37;--muted:#969ba8;--text:#f4f1ea}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,'Segoe UI',sans-serif}
button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid #3b3320;background:#1d1b16;color:var(--text);padding:9px 12px;border-radius:7px}button:hover{border-color:var(--gold)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.top{height:67px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 24px;border-bottom:1px solid var(--line);background:linear-gradient(95deg,#121317,#08090c)}
.brand{display:flex;align-items:center;gap:12px}.mark{display:grid;place-items:center;width:38px;height:38px;border:1px solid var(--gold);color:var(--gold);font:24px Georgia,serif}.brand h1{margin:0;font:22px Georgia,serif;letter-spacing:.02em}.brand h1 span{color:var(--gold)}.brand small{display:block;font-size:10px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin-top:3px}
.actions{display:flex;align-items:center;gap:8px}.primary{background:linear-gradient(130deg,#d4af37,#9e7924);color:#08090c;font-weight:700;border-color:#d4af37}
.shell{height:calc(100vh - 100px);display:grid;grid-template-columns:minmax(190px,270px) minmax(0,1fr)}.sidebar{background:var(--pane);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.sidehead{display:flex;justify-content:space-between;align-items:center;padding:18px 16px 10px}.label{color:var(--gold);font-size:10px;letter-spacing:.22em;font-weight:800}.tree{overflow:auto;flex:1;padding:4px 9px}.tree button{display:block;width:100%;text-align:left;background:transparent;border:0;padding:9px 11px;color:#d9d9d9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tree button:hover{background:#20222a}.tree .directory{color:var(--gold)}.tree .active{background:#2b261a;border-left:2px solid var(--gold)}.breadcrumb{font:12px ui-monospace,monospace;padding:14px;color:var(--muted);border-top:1px solid var(--line);overflow-wrap:anywhere}
.main{display:flex;flex-direction:column;min-width:0}.tabbar{height:43px;display:flex;align-items:center;background:var(--pane);border-bottom:1px solid var(--line);padding:0 17px;gap:12px}.tabbar strong{font:12px ui-monospace,monospace;color:var(--gold)}.tabbar span{color:var(--muted);font-size:11px}.editor-wrap{position:relative;flex:1;display:flex;min-height:0;background:var(--bg)}.gutter{width:50px;flex:none;text-align:right;padding:19px 12px;color:#585c68;font:13px/1.6 ui-monospace,monospace;border-right:1px solid #17191d;user-select:none;overflow:hidden;white-space:pre}.editor{border:0;resize:none;outline:none;flex:1;min-width:0;background:transparent;color:#e7e2d6;padding:19px;font:13px/1.6 ui-monospace,'Cascadia Code','JetBrains Mono',monospace;tab-size:4;white-space:pre;overflow:auto}.editor:focus{outline:none}.statusbar{height:33px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 15px;background:#161712;border-top:1px solid #4a3a18;color:#c3aa65;font:11px ui-monospace,monospace}
@media(max-width:680px){.top{height:60px;padding:0 12px}.brand h1{font-size:17px}.brand small{font-size:8px}.actions button{padding:8px}.shell{height:calc(100vh - 93px);grid-template-columns:135px minmax(0,1fr)}.sidehead{padding:12px 8px}.tree{padding:3px}.tree button{font-size:11px;padding:8px 4px}.editor{font-size:12px;padding:10px}.gutter{width:27px;padding:10px 4px;font-size:12px}.tabbar{padding:0 7px}.breadcrumb{padding:8px;font-size:10px}}
</style>
</head>
<body>
<header class="top"><div class="brand"><div class="mark" aria-hidden="true">Ω</div><div><h1>OMEGA <span>STUDIO</span></h1><small>Sovereign Development Environment</small></div></div><div class="actions"><button id="new-file" type="button">Nowy plik</button><button id="save-file" type="button" class="primary">Zapisz</button></div></header>
<div class="shell"><aside class="sidebar"><div class="sidehead"><span class="label">EXPLORER</span><button id="refresh" aria-label="Odśwież pliki" title="Odśwież">↻</button></div><nav id="file-tree" class="tree" aria-label="Pliki projektu"></nav><div class="breadcrumb" id="folder">/</div></aside><main class="main"><div class="tabbar"><strong id="tab">Wybierz plik</strong><span id="dirty-indicator"></span></div><div class="editor-wrap"><div id="line-numbers" class="gutter" aria-hidden="true">1</div><textarea id="editor" class="editor" aria-label="Edytor kodu" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" placeholder="Wybierz plik z panelu po lewej stronie"></textarea></div><footer class="statusbar"><span id="status" role="status">Gotowe</span><span id="position">Ln 1, Col 1 · UTF-8</span></footer></main></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
let folder='.',current=null,etag=null,dirty=false,loading=false;
function status(message){$('status').textContent=message}
function safePath(parent,name){return parent==='.'?name:parent+'/'+name}
async function api(url,options){const response=await fetch(url,{credentials:'same-origin',cache:'no-store',...options});if(!response.ok){let detail='HTTP '+response.status;try{detail=(await response.json()).detail||detail}catch{}throw new Error(detail)}return response.json()}
function updatePosition(){const e=$('editor'),start=e.selectionStart,part=e.value.slice(0,start),line=part.split('\n');$('position').textContent='Ln '+line.length+', Col '+(line.at(-1).length+1)+' · UTF-8';$('line-numbers').textContent=Array.from({length:Math.max(1,e.value.split('\n').length)},(_,i)=>i+1).join('\n')}
function setDirty(value){dirty=value;$('dirty-indicator').textContent=value?'● niezapisane':''}
async function openFile(path){if(dirty&&!confirm('Masz niezapisane zmiany. Odrzucić je?'))return;try{const data=await api('/api/read?path='+encodeURIComponent(path));current=data.path;etag=data.sha256;$('editor').value=data.content;$('tab').textContent=current;setDirty(false);updatePosition();status('Otworzono '+current);renderActive()}catch(error){status('Błąd: '+error.message)}}
function renderActive(){for(const el of $('file-tree').querySelectorAll('button[data-path]'))el.classList.toggle('active',el.dataset.path===current)}
async function loadTree(path='.') {if(loading)return;loading=true;try{const data=await api('/api/tree?path='+encodeURIComponent(path));folder=data.path;$('folder').textContent='/'+(folder==='.'?'':folder);const tree=$('file-tree');tree.replaceChildren();if(folder!=='.'){const up=document.createElement('button');up.textContent='↰ ..';up.addEventListener('click',()=>loadTree(folder.includes('/')?folder.slice(0,folder.lastIndexOf('/')):'.'));tree.append(up)}for(const entry of data.entries){const item=document.createElement('button');item.textContent=(entry.directory?'▸  ':'◇  ')+entry.name;item.dataset.path=entry.path;if(entry.directory)item.className='directory';item.addEventListener('click',()=>entry.directory?loadTree(entry.path):openFile(entry.path));tree.append(item)}renderActive();status(data.entries.length+' elementów w katalogu')}catch(error){status('Błąd: '+error.message)}finally{loading=false}}
async function save(){if(!current){status('Wybierz plik');return}try{const body={path:current,content:$('editor').value};if(etag)body.expected_sha256=etag;const data=await api('/api/write',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});etag=data.sha256;setDirty(false);await loadTree(folder);status('Zapisano '+data.bytes+' bajtów')}catch(error){status('Nie zapisano: '+error.message)}}
async function newFile(){const name=prompt('Nazwa nowego pliku w bieżącym katalogu:');if(!name)return;if(name.includes('/')||name.includes('\\')||name==='.'||name==='..'){status('Nieprawidłowa nazwa pliku');return}const path=safePath(folder,name);try{const data=await api('/api/write',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({path,content:''})});current=path;etag=data.sha256;$('editor').value='';$('tab').textContent=path;setDirty(false);updatePosition();await loadTree(folder);$('editor').focus()}catch(error){status('Błąd: '+error.message)}}
$('save-file').addEventListener('click',save);$('new-file').addEventListener('click',newFile);$('refresh').addEventListener('click',()=>loadTree(folder));$('editor').addEventListener('input',()=>{setDirty(true);updatePosition()});$('editor').addEventListener('click',updatePosition);$('editor').addEventListener('keyup',updatePosition);$('editor').addEventListener('scroll',()=>{$('line-numbers').scrollTop=$('editor').scrollTop});document.addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='s'){event.preventDefault();save()}});window.addEventListener('beforeunload',event=>{if(dirty){event.preventDefault();event.returnValue=''}});loadTree();
</script>
</body></html>
